<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stack</title>
<link rel="stylesheet" href="fonts.css">
<style>@font-face{font-family:"Sora";src:url(Sora-Variable.woff2) format("woff2");font-weight:100 800;font-display:swap}</style>
<script src="matter.min.js"></script>
<style>
:root{--bg:#EDEDEA;--surface:#F6F6F4;--ink:#151615;--muted:#6E706C;--faint:#A3A5A0;--line:#D5D6D1;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111211;--surface:#191A19;--ink:#ECECE8;--muted:#9A9C97;--faint:#5E605C;--line:#2A2C2A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111211;--surface:#191A19;--ink:#ECECE8;--muted:#9A9C97;--faint:#5E605C;--line:#2A2C2A;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Sora,"Helvetica Neue",Arial,sans-serif;font-weight:300;font-size:15px;line-height:1.5;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px 24px;padding:14px max(20px,env(safe-area-inset-right,0px)) 14px max(20px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);flex-wrap:wrap}
.bar h1{font-size:19px;font-weight:500;letter-spacing:-.035em;margin:0;white-space:nowrap}
.bar h1 span{font-weight:300;color:var(--muted);margin-left:6px}
.mono{font-family:"Geist Mono",ui-monospace,monospace;font-size:11.5px;letter-spacing:.02em}
.stats{display:flex;gap:20px;color:var(--muted);flex-wrap:wrap}
.stats b{color:var(--ink);font-weight:500}
.tools{display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center;padding:10px max(20px,env(safe-area-inset-right,0px)) 10px max(20px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.tools .grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tools label{color:var(--muted)}
.stage{flex:1;position:relative;min-height:0;overflow:hidden}
canvas.full{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.ov{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:20px;padding:24px;background:color-mix(in oklab,var(--bg) 90%,transparent);z-index:5}
.ov h2{font-size:clamp(48px,9vw,120px);font-weight:300;letter-spacing:-.075em;line-height:.88;margin:0}
.ov h2 b{font-weight:300}
.ov p{max-width:44ch;margin:0 auto;color:var(--muted)}
.btn{border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:99px;padding:11px 22px;font:inherit;font-size:14px;font-weight:450;cursor:pointer;transition:background .2s,color .2s}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn.ghost{border-color:var(--line)}
.btn.s{padding:6px 12px;font-family:"Geist Mono",ui-monospace,monospace;font-size:11.5px;border-color:var(--line);font-weight:400}
.btn.s:hover{border-color:var(--ink);background:transparent;color:var(--ink)}
.btn.s[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
input[type=range]{accent-color:var(--ink);width:96px}
:focus-visible{outline:1px solid var(--ink);outline-offset:3px}

</style>
</head>
<body>
<script>
(function(){
  addEventListener("message",function(e){if(e.data&&e.data.type==="theme"){document.documentElement.setAttribute("data-theme",e.data.dark?"dark":"light");if(window.onTheme)window.onTheme();}});
  window.cols=function(){var cs=getComputedStyle(document.documentElement),o={};["bg","surface","ink","muted","faint","line"].forEach(function(k){o[k]=cs.getPropertyValue("--"+k).trim()});return o};
  window.DPR=Math.min(2,window.devicePixelRatio||1);
  window.fit=function(cv){var r=cv.getBoundingClientRect(),w=Math.max(1,Math.round(r.width)),h=Math.max(1,Math.round(r.height));if(cv.width!==Math.round(w*DPR)||cv.height!==Math.round(h*DPR)){cv.width=Math.round(w*DPR);cv.height=Math.round(h*DPR)}var ctx=cv.getContext("2d");ctx.setTransform(DPR,0,0,DPR,0,0);return {ctx:ctx,w:w,h:h}};
  window.store={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
  window.FM='"Geist Mono", ui-monospace, monospace';window.FS='Sora, "Helvetica Neue", Arial, sans-serif';
})();
</script>
<div class="bar"><h1>Stack<span>shape stacking</span></h1>
  <div class="stats mono"><span>height <b id="sHt">0.0 m</b></span><span>placed <b id="sP">0</b></span><span>lives <b id="sL">●●●</b></span><span>best <b id="sB">–</b></span></div></div>
<div class="stage" id="stage"><canvas class="full" id="cv" tabindex="0" aria-label="Stacking area. Tap or press space to drop a shape."></canvas>
  <div class="ov" id="ov">
    <div class="mono" style="color:var(--muted)">physics · tap or space to drop</div>
    <h2 id="ovT">St<b>ack</b></h2>
    <p id="ovP">A dropper swings above a narrow plinth. Tap to release each shape and build as high as you can. Three shapes may fall. The fourth ends the round.</p>
    <div class="row"><button class="btn" id="go" type="button">Start</button></div>
  </div>
</div>
<script>
(function(){
const $=id=>document.getElementById(id),cv=$("cv"),ov=$("ov");
let C=cols();window.onTheme=()=>{C=cols()};
if(!window.Matter){$("ovP").textContent="The physics engine didn't load. Check the connection and reopen this game.";$("go").hidden=true;return}
const {Engine,Bodies,Composite,Body}=Matter;
let engine,plinth,W,H,PL,unit,shapes=[],state="intro",lives=3,placed=0,best=+store.get("st-best")||0,t=0,cool=0,next,camOff=0,camTarget=0,height=0,flash=0,acc=0;
const TYPES=["box","square","circle","tri","pent","hex","plank","box","square"];
function makeBody(type,x,y){const s=unit,o={friction:.9,frictionStatic:1.2,restitution:.02,density:.0025,chamfer:{radius:2}};
  switch(type){case"box":return Bodies.rectangle(x,y,s*2,s,o);case"square":return Bodies.rectangle(x,y,s*1.1,s*1.1,o);case"circle":{const b=Bodies.circle(x,y,s*.62,{friction:.9,frictionStatic:1.2,restitution:.02,density:.0025});return b}
    case"tri":return Bodies.polygon(x,y,3,s*.85,o);case"pent":return Bodies.polygon(x,y,5,s*.72,o);case"hex":return Bodies.polygon(x,y,6,s*.66,o);case"plank":return Bodies.rectangle(x,y,s*3.2,s*.42,o)}}
function pick(){return TYPES[Math.floor(Math.random()*TYPES.length)]}
function hud(){$("sHt").textContent=(height/100).toFixed(1)+" m";$("sP").textContent=placed;$("sL").textContent="●".repeat(lives)+"○".repeat(3-lives);$("sB").textContent=best?(best/100).toFixed(1)+" m":"–"}
function start(){const r=cv.getBoundingClientRect();W=r.width;H=r.height;unit=Math.max(22,Math.min(48,Math.min(W,H)*.055));
  engine=Engine.create();engine.gravity.y=1;engine.positionIterations=10;engine.velocityIterations=8;
  PL={x:W/2,y:H-70,w:Math.max(unit*5,W*.34),h:22};plinth=Bodies.rectangle(PL.x,PL.y,PL.w,PL.h,{isStatic:true,friction:1});Composite.add(engine.world,plinth);
  shapes=[];lives=3;placed=0;height=0;camOff=0;camTarget=0;cool=0;next=pick();state="play";ov.hidden=true;hud();cv.focus()}
$("go").onclick=start;
function dropX(){return W/2+Math.sin(t*(.9+placed*.035))*Math.min(W*.24,PL.w*.9)}
function drop(){if(state!=="play"||cool>0)return;const y=70-camOff;const b=makeBody(next,dropX(),y);b.plugin={type:next,tone:placed%3,born:t};Composite.add(engine.world,b);shapes.push(b);next=pick();cool=.65;}
cv.addEventListener("pointerdown",e=>{e.preventDefault();drop()});
addEventListener("keydown",e=>{if(e.code==="Space"||e.key==="Enter"){e.preventDefault();if(state==="play")drop();else if(!ov.hidden)start()}});
function gameOver(){state="over";const hm=height;if(hm>best){best=hm;store.set("st-best",best)}hud();$("ovT").innerHTML=(hm/100).toFixed(1)+" <b>m</b>";$("ovP").textContent=`${placed} shapes placed. ${hm>=best&&hm>0?"A new best.":"Best: "+(best/100).toFixed(1)+" m."}`;$("go").textContent="Play again";setTimeout(()=>ov.hidden=false,700)}
function drawBody(ctx,b){const tone=b.plugin?b.plugin.tone:0;ctx.beginPath();
  if(b.circleRadius){ctx.arc(b.position.x,b.position.y,b.circleRadius,0,Math.PI*2)}else{const v=b.vertices;ctx.moveTo(v[0].x,v[0].y);for(let i=1;i<v.length;i++)ctx.lineTo(v[i].x,v[i].y);ctx.closePath()}
  ctx.fillStyle=tone===0?C.ink:tone===1?C.surface:C.faint;ctx.fill();ctx.strokeStyle=C.ink;ctx.lineWidth=1.2;ctx.stroke();
  if(b.circleRadius){ctx.strokeStyle=tone===0?C.surface:C.ink;ctx.beginPath();ctx.moveTo(b.position.x,b.position.y);ctx.lineTo(b.position.x+Math.cos(b.angle)*b.circleRadius*.8,b.position.y+Math.sin(b.angle)*b.circleRadius*.8);ctx.stroke()}}
function ghost(ctx,type,x,y){const b=makeBody(type,x,y);ctx.beginPath();if(b.circleRadius)ctx.arc(x,y,b.circleRadius,0,Math.PI*2);else{const v=b.vertices;ctx.moveTo(v[0].x,v[0].y);for(let i=1;i<v.length;i++)ctx.lineTo(v[i].x,v[i].y);ctx.closePath()}ctx.setLineDash([4,4]);ctx.strokeStyle=C.ink;ctx.lineWidth=1.2;ctx.stroke();ctx.setLineDash([])}
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;const {ctx,w,h}=fit(cv);ctx.clearRect(0,0,w,h);
  if(state==="intro"||!engine){ctx.fillStyle=C.ink;ctx.fillRect(w/2-w*.15,h-81,w*.3,22);requestAnimationFrame(frame);return}
  t+=dt;cool=Math.max(0,cool-dt);flash=Math.max(0,flash-dt);
  acc+=dt;while(acc>=1/60){Engine.update(engine,1000/60);acc-=1/60}
  // fallen + height
  let top=PL.y-PL.h/2;
  for(let i=shapes.length-1;i>=0;i--){const b=shapes[i];if(b.position.y>PL.y+260||b.position.x<-200||b.position.x>W+200){Composite.remove(engine.world,b);shapes.splice(i,1);if(state==="play"){lives--;flash=.5;if(lives<0){lives=0;hud();gameOver()}else hud()}continue}
    const settled=b.speed<.25&&(t-b.plugin.born)>.8;if(settled&&!b.plugin.counted){b.plugin.counted=true;if(state==="play"){placed++;hud()}}
    if(b.plugin.counted&&b.speed<.6&&b.bounds.min.y<top&&b.position.y<PL.y)top=b.bounds.min.y}
  height=Math.max(0,PL.y-PL.h/2-top);if(state==="play")hud();
  camTarget=Math.max(0,(H*.48)-top);camOff+=(camTarget-camOff)*Math.min(1,dt*3);
  ctx.save();ctx.translate(0,camOff);
  // ruler
  ctx.fillStyle=C.faint;ctx.font=`10px ${FM}`;for(let y=PL.y-PL.h/2,k=0;y>-camOff-40;y-=50,k++){ctx.fillRect(14,y,k%2?6:12,1);if(k%2===0&&k>0)ctx.fillText((k*50/100).toFixed(1)+" m",30,y+3)}
  if(height>0){ctx.strokeStyle=C.muted;ctx.setLineDash([2,4]);ctx.beginPath();ctx.moveTo(0,top);ctx.lineTo(W,top);ctx.stroke();ctx.setLineDash([])}
  if(best>0){const by=PL.y-PL.h/2-best;ctx.strokeStyle=C.faint;ctx.beginPath();ctx.moveTo(W-90,by);ctx.lineTo(W,by);ctx.stroke();ctx.fillStyle=C.faint;ctx.fillText("best",W-90,by-5)}
  // plinth
  ctx.fillStyle=C.ink;ctx.fillRect(PL.x-PL.w/2,PL.y-PL.h/2,PL.w,PL.h);ctx.fillStyle=C.line;ctx.fillRect(PL.x-PL.w*.08,PL.y+PL.h/2,PL.w*.16,H);
  shapes.forEach(b=>drawBody(ctx,b));
  if(state==="play"){const x=dropX(),y=70-camOff;ctx.strokeStyle=C.line;ctx.beginPath();ctx.moveTo(0,y-38);ctx.lineTo(W,y-38);ctx.stroke();ctx.fillStyle=C.ink;ctx.fillRect(x-14,y-42,28,8);ctx.strokeStyle=C.faint;ctx.setLineDash([2,6]);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,top-10);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=cool>0?.3:1;ghost(ctx,next,x,y);ctx.globalAlpha=1}
  ctx.restore();
  if(flash>0){ctx.fillStyle=C.ink;ctx.globalAlpha=flash*.12;ctx.fillRect(0,0,w,h);ctx.globalAlpha=1}
  requestAnimationFrame(frame)}
hud();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
