<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ravan Dahan Ledger</title>
<link rel="preload" href="rozha-one.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="anek-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Global ledger. Same language as the game: glass over the maidan dusk, hairlines, gold-leaf corner brackets,
   Devanagari set in Rozha One. Hero with live totals, then the ranked board beside the ten evils and the latest turns. */
@font-face{font-family:'Rozha One';src:url(rozha-one.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Anek Latin';src:url(anek-latin.woff2) format('woff2');font-weight:100 800;font-stretch:75% 125%;font-display:swap}
:root{
  --leaf:#e7c27d; --leaf-hi:#f8e2b0; --ember:#ff7b30; --maya:#c9b8ff; --ok:#9be08a; --bad:#ff8d6b;
  --ash:#f4eadc; --ash-2:rgba(244,234,220,.66); --ash-3:rgba(244,234,220,.4);
  --line:rgba(244,234,220,.14); --line-2:rgba(244,234,220,.26); --glass:rgba(20,10,7,.6);
  --deva:'Rozha One',Georgia,serif; --ui:'Anek Latin',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(ellipse 90% 60% at 70% -10%,#5a2412 0,#2a120b 45%,#140a07 80%) fixed,#140a07;color:var(--ash);font-family:var(--ui);-webkit-font-smoothing:antialiased;padding:36px 16px 32px}
[lang="hi"],.deva{font-family:var(--deva);font-weight:400}
.wrap{width:min(1180px,100%);margin:0 auto;display:flex;flex-direction:column;gap:22px}
.label{font-weight:500;font-size:13px;color:var(--ash-2)}
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 28px}
.title{display:flex;flex-direction:column;gap:4px}
.deva{font-size:clamp(46px,6vw,76px);line-height:.95;padding-top:.12em;background:linear-gradient(180deg,#fbe7bd 10%,#e7c27d 52%,#a8783a 90%);-webkit-background-clip:text;background-clip:text;color:transparent}
h1{margin:0;font-weight:500;font-stretch:125%;font-size:clamp(14px,1.4vw,17px);letter-spacing:.24em;color:var(--ash)}
.live{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ash-2)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(155,224,138,.6);animation:pulse 2s infinite}
.dot.off{background:#806a5a;animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(155,224,138,0)}100%{box-shadow:0 0 0 0 rgba(155,224,138,0)}}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-top:1px solid var(--line-2);border-bottom:1px solid var(--line)}
.stat{padding:14px 18px 16px}
.stat+.stat{border-left:1px solid var(--line)}
.stat b{display:block;font-weight:700;font-stretch:82%;font-size:clamp(30px,3.6vw,44px);line-height:1.1;color:var(--leaf-hi);font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:22px;align-items:start}
.card{position:relative;padding:22px;border-radius:6px;background:var(--glass);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--line);display:flex;flex-direction:column;gap:14px;min-width:0}
.card::before{content:'';position:absolute;inset:-1px;pointer-events:none;
  background:linear-gradient(var(--leaf),var(--leaf)) top left/16px 1.5px,linear-gradient(var(--leaf),var(--leaf)) top left/1.5px 16px,
             linear-gradient(var(--leaf),var(--leaf)) top right/16px 1.5px,linear-gradient(var(--leaf),var(--leaf)) top right/1.5px 16px,
             linear-gradient(var(--leaf),var(--leaf)) bottom left/16px 1.5px,linear-gradient(var(--leaf),var(--leaf)) bottom left/1.5px 16px,
             linear-gradient(var(--leaf),var(--leaf)) bottom right/16px 1.5px,linear-gradient(var(--leaf),var(--leaf)) bottom right/1.5px 16px;background-repeat:no-repeat}
.card h2{margin:0;font-weight:650;font-stretch:92%;font-size:26px;letter-spacing:-.01em;color:var(--ash)}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.tabs{display:flex;gap:18px}
.tabs button{font:500 15px var(--ui);color:var(--ash-3);background:none;border:0;border-bottom:2px solid transparent;padding:4px 0 6px;cursor:pointer}
.tabs button:hover{color:var(--ash-2)}
.tabs button[aria-selected="true"]{color:var(--ash);border-bottom-color:var(--ember)}
.tabs button:focus-visible{outline:2px solid var(--leaf);outline-offset:3px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:10px 10px;text-align:left;white-space:nowrap}
th{font-weight:500;font-size:13px;color:var(--ash-3);border-bottom:1px solid var(--line)}
td{border-bottom:1px solid rgba(244,234,220,.07);font-size:16px}
tr:last-child td{border-bottom:0}
.num{text-align:right}
.rank{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;font-weight:700;font-size:13px;color:var(--ash-2);border:1px solid var(--line-2)}
.r1{background:var(--leaf);border-color:var(--leaf);color:#140a07} .r2{background:#d6dbe3;border-color:#d6dbe3;color:#140a07} .r3{background:#c98a52;border-color:#c98a52;color:#140a07}
.name{font-weight:600;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.coins{font-weight:700;font-stretch:85%;font-size:20px;color:var(--leaf-hi)}
.coin{display:inline-block;width:.62em;height:.62em;margin-right:7px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#fff6d0,#e7c27d 48%,#8a5a1c 100%)}
tr.me td{background:linear-gradient(90deg,rgba(255,123,48,.15),rgba(255,123,48,0) 70%)}
tr.me .name::after{content:'you';margin-left:8px;font-size:12px;font-weight:600;color:var(--ember)}
tr.fresh td{animation:fresh 2.4s ease-out}
@keyframes fresh{0%{background:rgba(231,194,125,.28)}100%{background:transparent}}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:550;font-size:13px}
.pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.p-time,.p-lives{color:var(--ok)} .p-maya{color:var(--maya)} .p-skip,.p-quit{color:var(--leaf-hi)}
.p-solo{color:var(--ember)} .p-local{color:#9fd4ff} .p-online{color:#e2b0ee}
.win{color:var(--ember);font-weight:700}
.evgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px 6px}
.ev{padding:8px 2px 6px;text-align:center;min-width:0;position:relative;border-top:1px solid var(--line-2)}
.ev i{position:absolute;left:0;right:0;top:-1px;height:2px;background:var(--leaf);transform-origin:left;box-shadow:0 0 8px var(--leaf);width:0;transition:width .6s}
.ev .d{font-family:var(--deva);font-size:20px;color:var(--leaf);line-height:1.3}
.ev .n{font-size:12px;color:var(--ash-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .c{font-weight:700;font-stretch:82%;font-size:22px;color:var(--leaf-hi);line-height:1.2;font-variant-numeric:tabular-nums}
.feed{display:flex;flex-direction:column;margin:0;padding:0;list-style:none}
.feed li{display:flex;justify-content:space-between;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:14px}
.feed li:last-child{border-bottom:0}
.feed .who{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feed .what{color:var(--ash-2);white-space:nowrap}
.empty{padding:28px 12px;text-align:center;color:var(--ash-2);font-size:15px;line-height:1.5}
.empty b{display:block;font-weight:650;font-size:20px;color:var(--ash);margin-bottom:4px}
.note{font-size:13px;color:var(--ash-3)}
.err{padding:10px 12px;border-left:2px solid var(--ember);background:rgba(255,123,48,.08);font-size:14px;color:var(--ash-2)}
body.embed{padding:14px 10px;background:transparent}
body.embed .deva{font-size:44px}
@media (max-width:900px){ .grid{grid-template-columns:1fr} }
@media (max-width:560px){ .stats{grid-template-columns:repeat(2,minmax(0,1fr))} .stat:nth-child(3){border-left:0} .stat:nth-child(n+3){border-top:1px solid var(--line)} .evgrid{gap:2px 4px} .ev .c{font-size:18px} .card{padding:16px 12px} th,td{padding:8px 7px} td{font-size:14px} }
@media (prefers-reduced-motion:reduce){ .dot,tr.fresh td{animation:none} }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="title"><span class="deva" lang="hi">रावण दहन</span><h1>Global ledger</h1></div>
    <div class="live" id="live"><span class="dot off" id="dot"></span><span id="liveTxt">Connecting…</span></div>
  </header>
  <div class="err" id="err" hidden></div>
  <section class="stats" aria-label="Totals">
    <div class="stat"><span class="label">Archers</span><b id="sArchers">–</b></div>
    <div class="stat"><span class="label">Solo runs / matches</span><b id="sTurns">–</b></div>
    <div class="stat"><span class="label">Heads of evil burned</span><b id="sHeads">–</b></div>
    <div class="stat"><span class="label">Gold coins earned</span><b id="sCoins">–</b></div>
  </section>
  <div class="grid">
    <section class="card">
      <div class="head">
        <h2 id="boardTitle">Solo board</h2>
        <div class="tabs" role="tablist">
          <button role="tab" aria-selected="true" data-tab="solo">Solo</button>
          <button role="tab" aria-selected="false" data-tab="multi">Multiplayer</button>
          <button role="tab" aria-selected="false" data-tab="recent">Recent</button>
        </div>
      </div>
      <div class="tablewrap"><table id="table"></table></div>
      <div class="empty" id="emptyBoard" hidden><b>No archers yet</b><span id="emptyTxt">The first run played anywhere lands here within seconds.</span></div>
      <span class="note" id="boardNote"></span>
    </section>
    <div style="display:flex;flex-direction:column;gap:20px;min-width:0">
      <section class="card">
        <h2>Evils burned, all archers</h2>
        <div class="evgrid" id="evgrid"></div>
      </section>
      <section class="card">
        <h2>Latest turns</h2>
        <ul class="feed" id="feed"></ul>
        <div class="empty" id="emptyFeed" hidden>Waiting for the first arrow.</div>
      </section>
    </div>
  </div>
</div>
<script src="config.js"></script>
<script src="board.js"></script>
</body>
</html>
