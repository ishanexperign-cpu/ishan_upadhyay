<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tone loom</title>
<link rel="stylesheet" href="fonts.css">
<style>@font-face{font-family:"Sora";src:url(Sora-Variable.woff2) format("woff2");font-weight:100 800;font-display:swap}</style>

<style>
:root{--bg:#EDEDEA;--surface:#F6F6F4;--ink:#151615;--muted:#6E706C;--faint:#A3A5A0;--line:#D5D6D1;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111211;--surface:#191A19;--ink:#ECECE8;--muted:#9A9C97;--faint:#5E605C;--line:#2A2C2A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111211;--surface:#191A19;--ink:#ECECE8;--muted:#9A9C97;--faint:#5E605C;--line:#2A2C2A;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Sora,"Helvetica Neue",Arial,sans-serif;font-weight:300;font-size:15px;line-height:1.5;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px 24px;padding:14px max(20px,env(safe-area-inset-right,0px)) 14px max(20px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);flex-wrap:wrap}
.bar h1{font-size:19px;font-weight:500;letter-spacing:-.035em;margin:0;white-space:nowrap}
.bar h1 span{font-weight:300;color:var(--muted);margin-left:6px}
.mono{font-family:"Geist Mono",ui-monospace,monospace;font-size:11.5px;letter-spacing:.02em}
.stats{display:flex;gap:20px;color:var(--muted);flex-wrap:wrap}
.stats b{color:var(--ink);font-weight:500}
.tools{display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center;padding:10px max(20px,env(safe-area-inset-right,0px)) 10px max(20px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.tools .grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tools label{color:var(--muted)}
.stage{flex:1;position:relative;min-height:0;overflow:hidden}
canvas.full{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.ov{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:20px;padding:24px;background:color-mix(in oklab,var(--bg) 90%,transparent);z-index:5}
.ov h2{font-size:clamp(48px,9vw,120px);font-weight:300;letter-spacing:-.075em;line-height:.88;margin:0}
.ov h2 b{font-weight:300}
.ov p{max-width:44ch;margin:0 auto;color:var(--muted)}
.btn{border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:99px;padding:11px 22px;font:inherit;font-size:14px;font-weight:450;cursor:pointer;transition:background .2s,color .2s}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn.ghost{border-color:var(--line)}
.btn.s{padding:6px 12px;font-family:"Geist Mono",ui-monospace,monospace;font-size:11.5px;border-color:var(--line);font-weight:400}
.btn.s:hover{border-color:var(--ink);background:transparent;color:var(--ink)}
.btn.s[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
input[type=range]{accent-color:var(--ink);width:96px}
:focus-visible{outline:1px solid var(--ink);outline-offset:3px}

</style>
</head>
<body>
<script>
(function(){
  addEventListener("message",function(e){if(e.data&&e.data.type==="theme"){document.documentElement.setAttribute("data-theme",e.data.dark?"dark":"light");if(window.onTheme)window.onTheme();}});
  window.cols=function(){var cs=getComputedStyle(document.documentElement),o={};["bg","surface","ink","muted","faint","line"].forEach(function(k){o[k]=cs.getPropertyValue("--"+k).trim()});return o};
  window.DPR=Math.min(2,window.devicePixelRatio||1);
  window.fit=function(cv){var r=cv.getBoundingClientRect(),w=Math.max(1,Math.round(r.width)),h=Math.max(1,Math.round(r.height));if(cv.width!==Math.round(w*DPR)||cv.height!==Math.round(h*DPR)){cv.width=Math.round(w*DPR);cv.height=Math.round(h*DPR)}var ctx=cv.getContext("2d");ctx.setTransform(DPR,0,0,DPR,0,0);return {ctx:ctx,w:w,h:h}};
  window.store={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
  window.FM='"Geist Mono", ui-monospace, monospace';window.FS='Sora, "Helvetica Neue", Arial, sans-serif';
})();
</script>
<div class="bar"><h1>Tone loom<span>sixteen steps</span></h1><div class="stats mono"><span>state <b id="sSt">stopped</b></span><span>tempo <b id="sBpm">112</b></span><span>scale <b id="sSc">pentatonic</b></span></div></div>
<div class="tools mono">
  <div class="grp"><button class="btn s" id="play" type="button" aria-pressed="false">play sound</button><button class="btn s" id="rand" type="button">random</button><button class="btn s" id="clear" type="button">clear</button></div>
  <div class="grp" id="scales"><label>scale</label></div>
  <div class="grp" id="waves"><label>wave</label></div>
  <div class="grp"><label for="bpm">tempo</label><input type="range" id="bpm" min="60" max="180" value="112"></div>
</div>
<div class="stage"><canvas class="full" id="cv" aria-label="Sixteen by eight note grid. Tap cells to toggle notes."></canvas></div>
<script>
(function(){
const $=id=>document.getElementById(id),cv=$("cv");let C=cols();window.onTheme=()=>{C=cols()};
const COLS=16,ROWS=8;const SCALES={pentatonic:[0,2,4,7,9],dorian:[0,2,3,5,7,9,10],hirajoshi:[0,2,3,7,8],bhairav:[0,1,4,5,7,8,11]};const WAVES=["triangle","sine","square","sawtooth"];
let scale="pentatonic",wave="triangle",grid=[],ac=null,master=null,playing=false,step=-1,next=0,rings=[],drag=null;
for(let r=0;r<ROWS;r++)grid.push(Array(COLS).fill(false));
[[0,7],[2,5],[4,3],[6,4],[8,7],[10,2],[12,3],[14,5],[1,1],[5,0],[9,1],[13,0],[3,6],[11,6],[15,4],[7,2]].forEach(([c,r])=>grid[r][c]=true);
function freqs(){const sc=SCALES[scale],out=[];let i=0;while(out.length<ROWS){const oct=Math.floor(i/sc.length),deg=sc[i%sc.length];out.push(220*Math.pow(2,(deg+12*oct)/12));i++}return out.reverse()}
function chips(id,list,cur,on){const el=$(id);list.forEach(n=>{const b=document.createElement("button");b.type="button";b.className="btn s";b.textContent=n;b.setAttribute("aria-pressed",n===cur);b.onclick=()=>{on(n);[...el.querySelectorAll("button")].forEach(x=>x.setAttribute("aria-pressed",x.textContent===n))};el.appendChild(b)})}
chips("scales",Object.keys(SCALES),scale,n=>{scale=n;$("sSc").textContent=n});chips("waves",WAVES,wave,n=>wave=n);
$("bpm").oninput=()=>$("sBpm").textContent=$("bpm").value;
function ensureAudio(){if(ac)return true;try{ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.55;const comp=ac.createDynamicsCompressor();master.connect(comp);comp.connect(ac.destination);return true}catch(e){$("sSt").textContent="no audio here";return false}}
function note(f,at){const o=ac.createOscillator(),g=ac.createGain();o.type=wave;o.frequency.value=f;const peak=wave==="square"||wave==="sawtooth"?.05:.13;g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(peak,at+.01);g.gain.exponentialRampToValueAtTime(.0001,at+.5);o.connect(g);g.connect(master);o.start(at);o.stop(at+.55)}
$("play").onclick=()=>{if(!ensureAudio())return;ac.resume();playing=!playing;$("play").setAttribute("aria-pressed",playing);$("play").textContent=playing?"stop":"play sound";$("sSt").textContent=playing?"playing":"stopped";if(playing)next=ac.currentTime+.05};
$("clear").onclick=()=>grid.forEach(r=>r.fill(false));
$("rand").onclick=()=>{grid.forEach(r=>r.fill(false));for(let c=0;c<COLS;c++)if(Math.random()<.8){grid[Math.floor(Math.random()*ROWS)][c]=true;if(Math.random()<.25)grid[Math.floor(Math.random()*ROWS)][c]=true}};
function layout(w,h){const pad=24,top=34,cw=(w-pad*2)/COLS,ch=(h-pad-top)/ROWS;return {pad,top,cw,ch}}
function cellAt(e){const r=cv.getBoundingClientRect(),L=layout(r.width,r.height),x=e.clientX-r.left,y=e.clientY-r.top,c=Math.floor((x-L.pad)/L.cw),rr=Math.floor((y-L.top)/L.ch);return (c>=0&&c<COLS&&rr>=0&&rr<ROWS)?[rr,c]:null}
cv.addEventListener("pointerdown",e=>{const k=cellAt(e);if(!k)return;cv.setPointerCapture(e.pointerId);const v=!grid[k[0]][k[1]];drag=v;grid[k[0]][k[1]]=v;if(v&&ac){note(freqs()[k[0]],ac.currentTime)}});
cv.addEventListener("pointermove",e=>{if(drag===null)return;const k=cellAt(e);if(k&&grid[k[0]][k[1]]!==drag){grid[k[0]][k[1]]=drag;if(drag&&ac)note(freqs()[k[0]],ac.currentTime)}});
addEventListener("pointerup",()=>drag=null);
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  if(playing&&ac){const STEP=60/+$("bpm").value/4,F=freqs();while(next<ac.currentTime+.1){step=(step+1)%COLS;for(let r=0;r<ROWS;r++)if(grid[r][step]){note(F[r],next);rings.push({c:step,r,l:1})}next+=STEP}}
  const {ctx,w,h}=fit(cv),L=layout(w,h);ctx.clearRect(0,0,w,h);
  for(let c=0;c<COLS;c++){if(c===step&&playing){ctx.fillStyle=C.line;ctx.fillRect(L.pad+c*L.cw,L.top,L.cw,L.ch*ROWS)}if(c%4===0){ctx.fillStyle=C.muted;ctx.font=`10px ${FM}`;ctx.fillText(String(c/4+1),L.pad+c*L.cw+2,L.top-12);ctx.fillStyle=C.line;ctx.fillRect(L.pad+c*L.cw,L.top-4,1,L.ch*ROWS+4)}}
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const x=L.pad+c*L.cw+L.cw/2,y=L.top+r*L.ch+L.ch/2,rad=Math.min(L.cw,L.ch)*.3;
    if(grid[r][c]){ctx.fillStyle=C.ink;ctx.beginPath();const k=(c===step&&playing)?1.25:1;ctx.arc(x,y,rad*k,0,Math.PI*2);ctx.fill()}else{ctx.strokeStyle=C.line;ctx.lineWidth=1;ctx.beginPath();ctx.arc(x,y,rad*.5,0,Math.PI*2);ctx.stroke()}}
  for(let i=rings.length-1;i>=0;i--){const g=rings[i];g.l-=dt*1.2;if(g.l<=0){rings.splice(i,1);continue}const x=L.pad+g.c*L.cw+L.cw/2,y=L.top+g.r*L.ch+L.ch/2;ctx.strokeStyle=C.ink;ctx.globalAlpha=g.l*.8;ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(x,y,Math.min(L.cw,L.ch)*.3+(1-g.l)*L.cw*1.8,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1}
  requestAnimationFrame(frame)}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
